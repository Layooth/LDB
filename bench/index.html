<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LittleDB 性能测试台</title>
<style>
  :root { --bg:#10141c; --card:#1a2029; --line:#2a3341; --fg:#dfe6ef; --dim:#8b98a9;
          --ok:#4cc38a; --warn:#e8b339; --acc:#5b9dff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Segoe UI", "Microsoft YaHei", sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:4px; }
  input, select { width:100%; background:#0d1117; color:var(--fg); border:1px solid var(--line);
                  border-radius:6px; padding:8px 10px; font-size:14px; }
  input:focus, select:focus { outline:1px solid var(--acc); }
  button { border:0; border-radius:8px; padding:10px 22px; font-size:15px; cursor:pointer;
           font-weight:600; }
  .primary { background:var(--acc); color:#0b1220; }
  .primary:disabled { opacity:.45; cursor:not-allowed; }
  .ghost { background:transparent; color:var(--dim); border:1px solid var(--line); }
  .row { display:flex; gap:10px; align-items:center; margin-top:14px; }
  #progressWrap { height:8px; background:#0d1117; border-radius:4px; overflow:hidden;
                  flex:1; }
  #progressBar { height:100%; width:0%; background:var(--acc); transition:width .3s; }
  #stage { font-size:13px; color:var(--dim); min-width:180px; }
  .scen { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .scen .name { width:130px; font-size:14px; }
  .scen .barwrap { flex:1; height:18px; background:#0d1117; border-radius:4px; overflow:hidden; }
  .scen .bar { height:100%; background:linear-gradient(90deg,#2f6fdd,#5b9dff); }
  .scen .num { width:150px; text-align:right; font-size:13px; color:var(--fg);
               font-variant-numeric:tabular-nums; }
  .lat { font-size:12px; color:var(--dim); margin:2px 0 10px 140px; }
  .lat b { color:var(--warn); font-weight:600; }
  #log { font-family:Consolas, monospace; font-size:12px; color:var(--dim);
         max-height:220px; overflow-y:auto; white-space:pre-wrap; }
  .meta { color:var(--dim); font-size:13px; margin-top:8px; }
  .err { color:#ff7b72; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LittleDB 性能测试台</h1>
  <div class="sub" id="dbInfo">数据库未启动</div>

  <div class="card">
    <div class="grid">
      <div><label>逐条插入（行）</label><input id="single" type="number" value="300"></div>
      <div><label>批量插入（总行数）</label><input id="batch" type="number" value="20000"></div>
      <div><label>批量大小（行/批）</label><input id="batch_size" type="number" value="500"></div>
      <div><label>主键点查（次）</label><input id="point" type="number" value="2000"></div>
      <div><label>索引范围扫（次）</label><input id="range" type="number" value="500"></div>
      <div><label>单行更新（次）</label><input id="update" type="number" value="1000"></div>
      <div><label>并发会话数</label><input id="workers" type="number" value="4"></div>
      <div><label>混合并发持续（秒）</label><input id="seconds" type="number" value="5"></div>
      <div><label>提交耐久性</label>
        <select id="sync">
          <option value="full" selected>full（每笔 fsync，默认）</option>
          <option value="normal">normal（吞吐优先）</option>
        </select>
      </div>
    </div>
    <div class="row">
      <button class="primary" id="startBtn">▶ 开始测试</button>
      <button class="ghost" id="stopBtn">■ 停止</button>
      <div id="progressWrap"><div id="progressBar"></div></div>
      <span id="stage">待机</span>
    </div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <h3 style="margin:0 0 10px; font-size:16px">结果</h3>
    <div id="chart"></div>
    <div id="latencies"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px; font-size:16px">日志</h3>
    <div id="log">（等待开始）</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let polling = null;

function renderResults(results) {
  $('resultCard').style.display = 'block';
  const items = results.scenarios || [];
  const max = Math.max(...items.map(s => s.ops_per_s), 1);
  $('chart').innerHTML = items.map(s => `
    <div class="scen">
      <div class="name">${s.label}</div>
      <div class="barwrap"><div class="bar" style="width:${(s.ops_per_s / max * 100).toFixed(1)}%"></div></div>
      <div class="num">${s.ops_per_s.toLocaleString()} ops/s</div>
    </div>`).join('');
  $('latencies').innerHTML = items
    .filter(s => s.latency)
    .map(s => `<div class="lat">${s.label}　p50=<b>${s.latency.p50}ms</b>
        p95=<b>${s.latency.p95}ms</b> p99=<b>${s.latency.p99}ms</b> max=${s.latency.max}ms</div>`)
    .join('');
  const m = results.meta || {};
  $('meta').textContent =
    `总行数约 ${m.total_rows} · ${m.pages} 页 · ${m.mb} MB · sync=${m.sync}`;
}

function poll() {
  fetch('/api/status').then(r => r.json()).then(st => {
    $('dbInfo').textContent = st.db_url
      ? `数据库：${st.db_url}　·　数据目录 bench\\data　·　进程 ${st.db_pid}` : '数据库未启动';
    $('progressBar').style.width = ((st.progress || 0) * 100).toFixed(1) + '%';
    $('stage').textContent = st.stage || '待机';
    $('log').textContent = (st.log || []).join('\n');
    $('log').scrollTop = $('log').scrollHeight;
    if (st.results) renderResults(st.results);
    $('startBtn').disabled = !!st.running;
    if (!st.running && polling) { clearInterval(polling); polling = null; }
  }).catch(() => {});
}

$('startBtn').onclick = () => {
  const cfg = {};
  for (const key of ['single','batch','batch_size','point','range','update','workers','seconds'])
    cfg[key] = Number($(key).value);
  cfg.sync = $('sync').value;
  $('resultCard').style.display = 'none';
  fetch('/api/start', { method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify(cfg) })
    .then(r => r.json()).then(r => {
      if (!r.ok) alert(r.message || '无法开始');
      if (!polling) polling = setInterval(poll, 500);
      poll();
    });
};
$('stopBtn').onclick = () => fetch('/api/stop', { method:'POST' });

poll();
polling = setInterval(poll, 800);
</script>
</body>
</html>
